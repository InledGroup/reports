name: Add to Project Board

on:
  issues:
    types: [opened]

permissions:
  issues: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      # NOTE: Adding items to an org ProjectV2 requires a token with `project` scope,
      # so GITHUB_TOKEN cannot be used here. Store a fine-grained PAT (or classic PAT
      # with `project` + `repo` scopes) as the PROJECT_PAT secret.
      - name: Add issue to project
        id: add-project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $issueId: ID!) {
              addProjectV2ItemById(input: {projectId: $projectId, contentId: $issueId}) {
                item { id }
              }
            }' \
            -f projectId="PVT_kwDOEGtWb84Bbe-_" \
            -f issueId="${{ github.event.issue.node_id }}" \
            --jq '.data.addProjectV2ItemById.item.id')
          echo "itemId=$ITEM_ID" >> "$GITHUB_OUTPUT"

      - name: Classify issue (Tipo field)
        if: steps.add-project.outputs.itemId != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          ITEM_ID: ${{ steps.add-project.outputs.itemId }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          PROJECT_ID="PVT_kwDOEGtWb84Bbe-_"
          # Tipo field of the "Inled Issues and Errors" board
          FIELD_ID="PVTSSF_lADOEGtWb84Bbe-_zhWPMX0"
          # Options: Error=0fad1b2f, Idea=cdb185ea, Ayuda=bb79688a
          LABELS_LOWER=$(printf '%s' "$ISSUE_LABELS" | tr '[:upper:]' '[:lower:]')

          OPTION_ID=""
          case ",$LABELS_LOWER," in
            *,bug,*|*,error,*)     OPTION_ID="0fad1b2f" ;; # Error
            *,idea,*|*,enhancement,*) OPTION_ID="cdb185ea" ;; # Idea
            *,task,*|*,suggestion,*|*,help,*) OPTION_ID="bb79688a" ;; # Ayuda
          esac

          [ -z "$OPTION_ID" ] && echo "No matching label, skipping classification" && exit 0

          gh api graphql -f query='
            mutation($pid: ID!, $iid: ID!, $fid: ID!, $oid: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $pid, itemId: $iid, fieldId: $fid,
                value: { singleSelectOptionId: $oid }
              }) { projectV2Item { id } }
            }' \
            -f pid="$PROJECT_ID" -f iid="$ITEM_ID" \
            -f fid="$FIELD_ID" -f oid="$OPTION_ID"
          echo "Classified issue OK"
